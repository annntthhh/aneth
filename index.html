<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Para ti</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="envelope" id="envelope" tabindex="0" role="button" aria-pressed="false" aria-label="Abrir carta">
      <div class="flap" aria-hidden="true"></div>
      <div class="body">
        <div class="card">
          <h1>Para ti</h1>
          <p class="message" id="message">teamomuchomuchomuchomuchomicorazoncitodemelon,amordemivida,negrodemisojos,mihombre,solomiomiomiomiomioydenadiemas</p>
          <div class="controls">
            <button id="openBtn" class="open-btn">Abrir</button>
            <button id="musicBtn" class="music-btn" aria-pressed="false">Reproducir canción</button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint">Haz clic en el sobre para abrirlo</p>

    <div class="player-wrap" aria-hidden="true">
      <iframe id="ytPlayer" width="0" height="0" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
